<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts: preconnect early + load as a real <link> instead of a CSS
         @import (an @import can't be discovered until the local stylesheet
         that contains it has already downloaded and parsed, which was
         serializing this behind the app's own CSS bundle in the network
         waterfall — see PageSpeed's "Network dependency tree" finding). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <title>
      AJEEM.S (Ajeem Suban) — AI & Data Science Developer | Founder, TAMIL-AI

    />

    <link rel="canonical" href="https://ajeem-suban.vercel.app/" />
    <meta name="robots" content="index, follow" />
